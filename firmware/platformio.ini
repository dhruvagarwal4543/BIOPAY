; Integrated BioPay terminal for ESP32 NodeMCU-32S (R307S + 4x4 keypad + single-channel LED, no OLED/buzzer).
; Needs src/config.h (copy include_config.example.h). Native logic tests: `make test`.
[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit Fingerprint Sensor Library@^2.1.3
  chris--a/Keypad@^3.1.1
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11
lib_extra_dirs = lib
