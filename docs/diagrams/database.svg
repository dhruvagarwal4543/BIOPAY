roke="#2b3a55" stroke-width="2"/><text x="735.0" y="456" fill="#e8edf6" font-size="17" font-weight="700" text-anchor="middle">LedgerEntry</text><text x="735.0" y="480" fill="#94a1b8" font-size="13" text-anchor="middle">payment, wallet (FK)</text><text x="735.0" y="499" fill="#94a1b8" font-size="13" text-anchor="middle">delta != 0</text><text x="735.0" y="518" fill="#94a1b8" font-size="13" text-anchor="middle">unique(payment, wallet)</text><rect x="40" y="430" width="230" height="78" rx="10" fill="#141f33" stroke="#2b3a55" stroke-width="2"/><text x="155.0" y="456" fill="#e8edf6" font-size="17" font-weight="700" text-anchor="middle">AuditEvent</text><text x="155.0" y="480" fill="#94a1b8" font-size="13" text-anchor="middle">actor, action, detail</text><text x="155.0" y="499" fill="#94a1b8" font-size="13" text-anchor="middle">created_at</text><line x1="270" y1="125" x2="300" y2="125" stroke="#2dd4bf" stroke-width="2.2"/><text x="285.0" y="117.0" fill="#94a1b8" font-size="12" text-anchor="middle">1:1</text><line x1="415" y1="180" x2="480" y2="250" stroke="#2dd4bf" stroke-width="2.2"/><text x="447.5" y="207.0" fill="#94a1b8" font-size="12" text-anchor="middle">1:1</text><line x1="675" y1="180" x2="600" y2="250" stroke="#2dd4bf" stroke-width="2.2"/><text x="637.5" y="207.0" fill="#94a1b8" font-size="12" text-anchor="middle">1:1</text><line x1="790" y1="140" x2="840" y2="140" stroke="#2dd4bf" stroke-width="2.2"/><text x="815.0" y="132.0" fill="#94a1b8" font-size="12" text-anchor="middle">1:N</text><line x1="955" y1="190" x2="955" y2="270" stroke="#2dd4bf" stroke-width="2.2"/><text x="955.0" y="222.0" fill="#94a1b8" font-size="12" text-anchor="middle">1:N</text><line x1="415" y1="180" x2="415" y2="430" stroke="#2dd4bf" stroke-width="2.2"/><text x="415.0" y="297.0" fill="#94a1b8" font-size="12" text-anchor="middle">1:N</text><line x1="530" y1="475" x2="620" y2="475" stroke="#2dd4bf" stroke-width="2.2"/><text x="575.0" y="467.0" fill="#94a1b8" font-size="12" text-anchor="middle">1:2</text><line x1="600" y1="340" x2="740" y2="430" stroke="#2dd4bf" stroke-width="2.2"/><text x="670.0" y="377.0" fill="#94a1b8" font-size="12" text-anchor="middle">1:N</text><text x="40" y="605" fill="#94a1b8" font-size="12.5">Also: Merchant.user -> User (1:1). Enrollment.customer -> Customer (N:1). Payment -> Customer (payer), Merchant, Terminal (N:1).</text><text x="40" y="630" fill="#94a1b8" font-size="12.5">Every successful payment has exactly two ledger rows summing to 0; reconciliation: opening_balance + sum(ledger) = balance.</text></svg>