<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="470" viewBox="0 0 1190 470" font-family="Helvetica, Arial, sans-serif"><rect width="1190" height="470" fill="#0a101c"/><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2dd4bf"/></marker></defs><text x="40" y="44" fill="#e8edf6" font-size="24" font-weight="700">BioPay system architecture</text><text x="40" y="68" fill="#f2b84b" font-size="13">SIMULATED PAYMENT — NO REAL MONEY. Terminal + sensor are PLANNED (dashed), not yet built or tested.</text><rect x="40" y="130" width="200" height="110" rx="10" fill="#141f33" stroke="#f2b84b" stroke-width="2" stroke-dasharray="7 5"/><text x="140.0" y="156" fill="#f2b84b" font-size="17" font-weight="700" text-anchor="middle">Fingerprint sensor</text><text x="140.0" y="180" fill="#94a1b8" font-size="13" text-anchor="middle">matches ON the sensor</text><text x="140.0" y="199" fill="#94a1b8" font-size="13" text-anchor="middle">returns slot number only</text><rect x="300" y="130" width="220" height="110" rx="10" fill="#141f33" stroke="#f2b84b" stroke-width="2" stroke-dasharray="7 5"/><text x="410.0" y="156" fill="#f2b84b" font-size="17" font-weight="700" text-anchor="middle">ESP32-S3 terminal</text><text x="410.0" y="180" fill="#94a1b8" font-size="13" text-anchor="middle">payment UUID saved first</text><text x="410.0" y="199" fill="#94a1b8" font-size="13" text-anchor="middle">retry with same UUID</text><rect x="600" y="110" width="250" height="150" rx="10" fill="#141f33" stroke="#2dd4bf" stroke-width="2"/><text x="725.0" y="136" fill="#e8edf6" font-size="17" font-weight="700" text-anchor="middle">Django REST API</text><text x="725.0" y="160" fill="#94a1b8" font-size="13" text-anchor="middle">terminal key auth</text><text x="725.0" y="179" fill="#94a1b8" font-size="13" text-anchor="middle">validation, roles, CSRF</text><text x="725.0" y="198" fill="#94a1b8" font-size="13" text-anchor="middle">payment service (locks)</text><rect x="930" y="130" width="220" height="110" rx="10" fill="#141f33" stroke="#2dd4bf" stroke-width="2"/><text x="1040.0" y="156" fill="#e8edf6" font-size="17" font-weight="700" text-anchor="middle">PostgreSQL</text><text x="1040.0" y="180" fill="#94a1b8" font-size="13" text-anchor="middle">wallets, ledger, payments</text><text x="1040.0" y="199" fill="#94a1b8" font-size="13" text-anchor="middle">constraints + audit log</text><rect x="600" y="330" width="250" height="100" rx="10" fill="#141f33" stroke="#a78bfa" stroke-width="2"/><text x="725.0" y="356" fill="#e8edf6" font-size="17" font-weight="700" text-anchor="middle">React web app (Vite)</text><text x="725.0" y="380" fill="#94a1b8" font-size="13" text-anchor="middle">3D landing, customer,</text><text x="725.0" y="399" fill="#94a1b8" font-size="13" text-anchor="middle">merchant, admin</text><rect x="300" y="330" width="220" height="100" rx="10" fill="#141f33" stroke="#2dd4bf" stroke-width="2"/><text x="410.0" y="356" fill="#e8edf6" font-size="17" font-weight="700" text-anchor="middle">Software simulator</text><text x="410.0" y="380" fill="#94a1b8" font-size="13" text-anchor="middle">dev-only, customer opt-in</text><text x="410.0" y="399" fill="#94a1b8" font-size="13" text-anchor="middle">same payment service</text><line x1="240" y1="185" x2="300" y2="185" stroke="#f2b84b" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="270.0" y="177.0" fill="#94a1b8" font-size="12" text-anchor="middle">slot</text><line x1="520" y1="185" x2="600" y2="185" stroke="#f2b84b" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="560.0" y="177.0" fill="#94a1b8" font-size="12" text-anchor="middle">HTTPS + key</text><line x1="850" y1="185" x2="930" y2="185" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#a)"/><text x="890.0" y="177.0" fill="#94a1b8" font-size="12" text-anchor="middle">SQL tx</text><line x1="725" y1="330" x2="725" y2="260" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#a)"/><text x="725.0" y="287.0" fill="#94a1b8" font-size="12" text-anchor="middle">session + CSRF</text><line x1="520" y1="380" x2="600" y2="230" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#a)"/><text x="560.0" y="297.0" fill="#94a1b8" font-size="12" text-anchor="middle">same API</text></svg>