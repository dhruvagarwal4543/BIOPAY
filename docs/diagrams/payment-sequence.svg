<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="640" viewBox="0 0 1190 640" font-family="Helvetica, Arial, sans-serif"><rect width="1190" height="640" fill="#0a101c"/><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#2dd4bf"/></marker></defs><text x="40" y="44" fill="#e8edf6" font-size="24" font-weight="700">Payment sequence (simulated BioCoins)</text><text x="40" y="68" fill="#f2b84b" font-size="13">Hardware lifelines (finger, sensor, terminal) are PLANNED; the API and database part is verified by tests.</text><rect x="10" y="90" width="160" height="34" rx="8" fill="#141f33" stroke="#2b3a55" stroke-width="2"/><text x="90" y="112" fill="#e8edf6" font-size="14" font-weight="700" text-anchor="middle">Customer finger</text><line x1="90" y1="124" x2="90" y2="610" stroke="#2b3a55" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="230" y="90" width="160" height="34" rx="8" fill="#141f33" stroke="#2b3a55" stroke-width="2"/><text x="310" y="112" fill="#e8edf6" font-size="14" font-weight="700" text-anchor="middle">Sensor</text><line x1="310" y1="124" x2="310" y2="610" stroke="#2b3a55" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="450" y="90" width="160" height="34" rx="8" fill="#141f33" stroke="#2b3a55" stroke-width="2"/><text x="530" y="112" fill="#e8edf6" font-size="14" font-weight="700" text-anchor="middle">ESP32 terminal</text><line x1="530" y1="124" x2="530" y2="610" stroke="#2b3a55" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="690" y="90" width="160" height="34" rx="8" fill="#141f33" stroke="#2b3a55" stroke-width="2"/><text x="770" y="112" fill="#e8edf6" font-size="14" font-weight="700" text-anchor="middle">Django API</text><line x1="770" y1="124" x2="770" y2="610" stroke="#2b3a55" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="940" y="90" width="160" height="34" rx="8" fill="#141f33" stroke="#2b3a55" stroke-width="2"/><text x="1020" y="112" fill="#e8edf6" font-size="14" font-weight="700" text-anchor="middle">PostgreSQL</text><line x1="1020" y1="124" x2="1020" y2="610" stroke="#2b3a55" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="90" y1="160" x2="310" y2="160" stroke="#f2b84b" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="200.0" y="152" fill="#94a1b8" font-size="12.5" text-anchor="middle">place finger</text><line x1="310" y1="216" x2="530" y2="216" stroke="#f2b84b" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="420.0" y="208" fill="#94a1b8" font-size="12.5" text-anchor="middle">matched slot N (template stays in sensor)</text><path d="M530,272 h44 v22 h-44" fill="none" stroke="#f2b84b" stroke-width="2.2" marker-end="url(#a)"/><text x="584" y="288" fill="#94a1b8" font-size="12.5">create payment UUID, save to flash</text><line x1="530" y1="328" x2="770" y2="328" stroke="#f2b84b" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="650.0" y="320" fill="#94a1b8" font-size="12.5" text-anchor="middle">POST {payment_id, amount, sensor_slot} + terminal key</text><line x1="770" y1="384" x2="1020" y2="384" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#a)"/><text x="895.0" y="376" fill="#94a1b8" font-size="12.5" text-anchor="middle">lock terminal &gt; enrollment &gt; payment &gt; wallets</text><line x1="1020" y1="440" x2="770" y2="440" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#a)"/><text x="895.0" y="432" fill="#94a1b8" font-size="12.5" text-anchor="middle">debit + credit ledger rows, commit</text><line x1="770" y1="496" x2="530" y2="496" stroke="#f2b84b" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="650.0" y="488" fill="#94a1b8" font-size="12.5" text-anchor="middle">201 SUCCESS / 422 insufficient / 403 / 401 revoked</text><path d="M530,552 h44 v22 h-44" fill="none" stroke="#f2b84b" stroke-width="2.2" marker-end="url(#a)"/><text x="584" y="568" fill="#94a1b8" font-size="12.5">lost reply? resend SAME UUID</text><line x1="770" y1="608" x2="530" y2="608" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#a)"/><text x="650.0" y="600" fill="#94a1b8" font-size="12.5" text-anchor="middle">200 replayed (stored result), no second debit</text></svg>